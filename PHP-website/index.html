<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <title>Tela de Login</title>

    <link rel="stylesheet" type="text/css" href="./css/index.css">
    <script src="./js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="container-principal">
        <div class="formulario">
            <form id="form-login" action="./php/login.php" method="POST">
                <h3>Login</h3>
                <input type="text" placeholder="Usuário:" name="usuario" id="usuario" required="true" minlength="3"
                    maxlength="15">
                <input type="password" placeholder="Senha:" name="senha" id="senha" required="true" minlength="3"
                    maxlength="8">
                <input type="submit" value="Entrar">
                <br>
                <a href="./html/cadastro-usuario.html">cadastre-se aqui.</a>
            </form>
        </div>
    </div>
</body>

</html>
